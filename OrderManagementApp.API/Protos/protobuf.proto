syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "OrderManagementApp.API.Protos";

package order;

service OrderGrpcService {
  rpc GetOrderById (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest {
  int32 order_id = 1;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0; // proto3 enums must start at 0
  PENDING = 1;
  CONFIRMED = 2;
  SHIPPED = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}

message OrderItem {
  int32 order_item_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
  string unit_price = 4; // decimal as string, same rationale as TotalAmount
}

message OrderReply {
  int32 order_id = 1;
  google.protobuf.Timestamp order_date = 2;
  int32 customer_id = 3;
  string customer_name = 4;
  string total_amount = 5;
  OrderStatus status = 6;
  bytes row_version = 7;
  repeated OrderItem order_items = 8;
}
